<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ONE template for every product and service page:
       product.html?id=pharmacy-pos, product.html?id=power-bi-dashboards, ...
       The title and description are filled in from data/products.json by
       js/product-page.js, in the visitor's language. -->
  <title>Ahmad Akbary</title>
  <meta name="description" content="I build custom management systems, web apps and data dashboards for businesses and humanitarian organizations, in English, Dari and Pashto. Try the live demos." />
  <meta name="theme-color" content="#F7F4EC" />
  <!-- Icons: SVG for modern browsers, PNG fallback, and the iPhone home-screen icon -->
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />

  <!-- ==========================================================================
       SHARE PREVIEWS
       Preview apps (WhatsApp, Facebook...) don't run JavaScript, so every
       product link shares this general card; the page itself then shows the
       right product in the visitor's language.
       If your site address changes, run:  python tools/update-site-files.py
  =========================================================================== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ahmad Akbary" />
  <meta property="og:title" content="Ahmad Akbary | Custom software and data dashboards" />
  <meta property="og:description" content="I build custom management systems, web apps and data dashboards for businesses and humanitarian organizations, in English, Dari and Pashto. Try the live demos." />
  <meta property="og:image" content="https://ahmad0908-psr.github.io/assets/brand/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ahmad Akbary: custom software and data dashboards for businesses and NGOs" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://ahmad0908-psr.github.io/assets/brand/og-image.jpg" />

  <!-- ==========================================================================
       PRE-PAINT SETUP
       Runs before the page is drawn, so returning visitors never see a flash
       of the wrong theme or a left-to-right layout that suddenly flips.
       - Applies the saved theme (dark / light).
       - If the language is Dari or Pashto (from ?lang= or a saved choice),
         switches the page to right-to-left immediately and hides the text
         until the translations load (see "i18n pending" in style.css).
  =========================================================================== -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem("aa-theme");
        if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);

        var lang = new URLSearchParams(window.location.search).get("lang") || localStorage.getItem("aa-lang");
        if (lang === "fa" || lang === "ps") {
          root.setAttribute("dir", "rtl");
          root.setAttribute("lang", lang === "fa" ? "fa-AF" : "ps-AF");
          root.setAttribute("data-i18n-pending", "");
        }
      } catch (e) {
        /* localStorage can be blocked in private mode; defaults are fine. */
      }
    })();
  </script>

  <!-- Fonts for English. Vazirmatn (Dari / Pashto) is loaded on demand by
       js/i18n.js only when a visitor switches to one of those languages. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- GSAP animation library, saved locally in vendor/ so the site never
       depends on an outside server. "defer" keeps them in order and makes
       sure they're ready before main.js runs. If they ever fail to load,
       the site still works, just without animation. -->
  <script src="vendor/gsap/gsap.min.js" defer></script>
  <script src="vendor/gsap/ScrollTrigger.min.js" defer></script>

  <!-- Native ES module: no build step, works on GitHub Pages as-is. -->
  <script type="module" src="js/product-page.js"></script>
</head>
<body>
  <!-- Shown only if JavaScript is turned off -->
  <noscript>
    <p class="noscript">This website needs JavaScript to show its content. | این ویب‌سایت برای نمایش محتوا به JavaScript نیاز دارد. | دا ویبپاڼه د منځپانګې د ښودلو لپاره JavaScript ته اړتیا لري.</p>
  </noscript>

  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <!-- ==========================================================================
       NAVIGATION
  =========================================================================== -->
  <header class="nav-wrap" id="nav-wrap">
    <nav class="nav container" data-i18n-attr="aria-label:nav.label" aria-label="Main">
      <a class="brand" href="index.html">
        <span class="brand__code" aria-hidden="true">&lt;</span><span data-i18n="brand.first">Ahmad</span>
        <span class="brand__accent" data-i18n="brand.last">Akbary</span><span class="brand__code" aria-hidden="true">/&gt;</span>
      </a>

      <ul class="nav__links">
        <li><a href="index.html#products" data-i18n="nav.products">Demos</a></li>
        <li><a href="index.html#services" data-i18n="nav.services">Services</a></li>
        <li><a href="index.html#how-it-works" data-i18n="nav.how">How it works</a></li>
        <li><a href="index.html#contact" data-i18n="nav.contact">Contact</a></li>
      </ul>

      <div class="nav__actions">
        <!-- Language switcher. Each label is written in its own script so
             people can find their language whatever language the page is in. -->
        <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:lang.label">
          <button class="lang-switch__btn" type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
          <button class="lang-switch__btn" type="button" data-lang="fa" lang="fa" aria-pressed="false">دری</button>
          <button class="lang-switch__btn" type="button" data-lang="ps" lang="ps" aria-pressed="false">پښتو</button>
        </div>

        <!-- Theme toggle: the sun shows in dark mode, the moon in light mode. -->
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode" data-i18n-attr="aria-label:theme.toggle;title:theme.toggle">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>

        <a class="icon-btn icon-btn--round nav__talk" href="index.html#contact" aria-label="Let's talk" data-i18n-attr="aria-label:nav.letsTalk;title:nav.letsTalk">
          <span data-icon="message" aria-hidden="true"></span>
        </a>

        <button class="icon-btn nav__burger" id="nav-burger" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- Mobile menu (shown below 960px by the burger button) -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true" inert>
    <ul class="mobile-menu__links">
      <li><a href="index.html#products" data-i18n="nav.products">Demos</a></li>
      <li><a href="index.html#services" data-i18n="nav.services">Services</a></li>
      <li><a href="index.html#how-it-works" data-i18n="nav.how">How it works</a></li>
      <li><a href="index.html#contact" data-i18n="nav.contact">Contact</a></li>
    </ul>
    <div class="lang-switch lang-switch--wide" role="group" aria-label="Language" data-i18n-attr="aria-label:lang.label">
      <button class="lang-switch__btn" type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
      <button class="lang-switch__btn" type="button" data-lang="fa" lang="fa" aria-pressed="false">دری</button>
      <button class="lang-switch__btn" type="button" data-lang="ps" lang="ps" aria-pressed="false">پښتو</button>
    </div>
  </div>

  <main id="main">
    <!-- Everything inside #product-root is rendered by js/product-page.js
         from the item in data/products.json that matches ?id= in the URL. -->
    <div id="product-root" aria-live="polite"></div>
  </main>

  <!-- ==========================================================================
       SCREENSHOT VIEWER (js/gallery.js)
       A native <dialog>: it traps keyboard focus, closes with Escape, and
       returns focus to the screenshot that opened it.
  =========================================================================== -->
  <dialog class="lightbox" id="lightbox" aria-label="Screenshots" data-i18n-attr="aria-label:product.galleryTitle">
    <div class="lightbox__inner">
      <button class="icon-btn lightbox__close" type="button" data-lightbox="close" aria-label="Close" data-i18n-attr="aria-label:gallery.close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightbox-img" src="data:," alt="" />
        <figcaption class="lightbox__caption" id="lightbox-caption"></figcaption>
      </figure>

      <div class="lightbox__controls" id="lightbox-controls">
        <button class="icon-btn" type="button" data-lightbox="prev" aria-label="Previous screenshot" data-i18n-attr="aria-label:gallery.prev">
          <span class="icon-back" data-icon="arrowRight" aria-hidden="true"></span>
        </button>
        <span class="lightbox__counter" id="lightbox-counter" aria-live="polite"></span>
        <button class="icon-btn" type="button" data-lightbox="next" aria-label="Next screenshot" data-i18n-attr="aria-label:gallery.next">
          <span class="icon-flip" data-icon="arrowRight" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </dialog>

  <!-- ==========================================================================
       FOOTER
  =========================================================================== -->
  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <a class="brand" href="index.html">
          <span class="brand__code" aria-hidden="true">&lt;</span><span data-i18n="brand.first">Ahmad</span>
          <span class="brand__accent" data-i18n="brand.last">Akbary</span><span class="brand__code" aria-hidden="true">/&gt;</span>
        </a>
        <p class="footer__tagline" data-i18n="footer.tagline">Custom management systems, web apps and data dashboards for businesses and humanitarian organizations.</p>
      </div>
      <ul class="footer__links" id="footer-links"><!-- rendered from data/config.json --></ul>
    </div>
    <div class="container footer__bottom">
      <p>&copy; <span id="footer-year"></span> <span data-i18n="brand.full">Ahmad Akbary</span>. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </div>
  </footer>

</body>
</html>
